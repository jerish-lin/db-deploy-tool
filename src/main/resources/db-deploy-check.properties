# Database Deploy Check Configuration
# These properties can be overridden in application.properties or application.yml

# Enable/disable the database deployment status pre-check
db.deploy.check.enabled=false

# Fail the application startup if deployment is in progress
db.deploy.check.fail-on-deployment-in-progress=true

# Fail the application startup if last deployment status is FAILED
db.deploy.check.fail-on-last-deployment-failed=true

# Fail the application startup if there are pending changelog scripts
db.deploy.check.fail-on-pending-changelog=true

# The changelog file path to check for pending scripts
db.deploy.check.changelog-path=classpath:db-changelog.yml