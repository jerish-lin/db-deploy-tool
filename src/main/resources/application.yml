# Database Deployment Tool Configuration
spring:
  profiles:
    active: default
  application:
    name: db-deploy-tool

# Database Configuration
schemaflow:
  database:
    url: "jdbc:sqlite:testdb.sqlite"
    username:
    password:
    driver: org.sqlite.JDBC
    max-pool-size: 10
    connection-timeout: 5000
    idle-timeout: 600000
    max-lifetime: 1800000
